---
# Cilium: CNI + kube-proxy replacement, and the Hubble observability stack.
#
# Hubble is NOT a separate release. `cilium hubble enable` mutates this same
# Helm release, so the hubble.* values below must stay here explicitly --
# Flux's upgrade.preserveValues defaults to false, so a release that omitted
# them would silently turn Hubble off on the first reconciliation.
#
# Values were taken from `helm get values cilium` on the previously running
# imperative install, not from the install script's --set flags. The Cilium
# CLI injects values the script never passed (cluster.name, operator.replicas,
# routingMode, tunnelProtocol); rebuilding from the script alone would have
# dropped them, and operator.replicas reverting to the chart default of 2 is
# unschedulable on a single node.
#
# ${...} values are supplied by the environment via postBuild substitution --
# see this repo's README. Nothing here names an environment, a provider or a
# tier; that is the infra repo's concern.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cilium
  targetNamespace: kube-system
  # Explicit, not inherited: Flux defaults storageNamespace to the
  # HelmRelease's own namespace (flux-system), which would NOT match the
  # existing release's storage in kube-system and would fail to adopt it.
  storageNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kubeProxyReplacement: true

    # Supplied by whichever environment instantiates this cluster, via the
    # bootstrap's postBuild substitution. How to reach the API server is a
    # property of the deployment, not of the cluster's desired state.
    #
    # The PORT is substituted too, as of the multi-node work. It was hardcoded
    # 6443 -- the API server's own port -- which is only correct while every
    # Cilium agent happens to share a node with a control plane. The agent is a
    # DaemonSet, so on any cluster with a plain worker that assumption fails on
    # exactly the node that has no other way to reach the API.
    #
    # An environment is free to pass a real address and 6443. The infra repo
    # passes 127.0.0.1 and k0s's node-local load balancer port, because that
    # pair is correct on every node including before a CNI exists -- which is
    # the bootstrap this file is part of.
    k8sServiceHost: "${K8S_SERVICE_HOST}"
    k8sServicePort: ${K8S_SERVICE_PORT}

    # Honour the podCIDR the control plane already allocates, instead of
    # Cilium's default cluster-pool -- which silently hands out 10.0.0.0/8
    # and makes the declared pod CIDR a fiction. Requires node .spec.podCIDR
    # to be populated; k0s does this (--allocate-node-cidrs=true).
    #
    # Deliberately delegated rather than restated: the pod CIDR is declared
    # by the environment that builds the cluster, so repeating the value here
    # would create a second place for it to drift.
    ipam:
      mode: kubernetes

    # Chart default is 2. On a single node the second replica is permanently
    # unschedulable.
    operator:
      replicas: 1

    routingMode: tunnel
    tunnelProtocol: vxlan

    # Substituted by the environment. Cilium's cluster.name is only load-
    # bearing for ClusterMesh/SPIRE, but it surfaces in Hubble's UI and flow
    # output, so it should identify the actual running cluster rather than
    # the archetype.
    cluster:
      name: "${CLUSTER_NAME}"

    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
