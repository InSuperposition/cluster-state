---
# Tetragon: eBPF runtime security observability (process execution, syscalls,
# file access). Genuinely independent of Cilium -- its own chart, release and
# DaemonSet, with no hard Cilium dependency -- it just happens to be published
# to the same Helm repository.
#
# dependsOn is ordering, not a hard requirement: Tetragon does not need Cilium
# to function, but it does need pod networking to pull its images and reach
# the API, so reconciling it before the CNI is ready just produces avoidable
# retries.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: flux-system
spec:
  interval: 1h
  releaseName: tetragon
  targetNamespace: kube-system
  # Same reasoning as cilium.yaml: must be explicit to match where the release
  # actually stores its state, rather than defaulting to flux-system.
  storageNamespace: kube-system
  dependsOn:
    - name: cilium
  chart:
    spec:
      chart: tetragon
      version: "1.7.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Chart defaults are what the imperative install used -- it passed no --set
  # flags at all, only --version and --namespace. Recorded explicitly here so
  # "no values" reads as a deliberate choice rather than an omission.
  values: {}
