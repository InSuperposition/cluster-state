---
# The `core` cluster role -- TRANSITIONAL, and identical to mgmt/ by design.
#
# `core` was named for a core-versus-edge fleet split. Adopting Cluster API
# replaces that axis with management-versus-workload, so the role this cluster
# actually plays is `mgmt`. Renaming it is a change in the infra repo, which
# derives the synced path from its own `cluster_role` output at runtime:
#
#   CLUSTER_STATE_PATH="./clusters/$(tofu output -raw cluster_role)"
#
# That rename cannot land before this path exists, and this path cannot be the
# only one while any infra revision still says `core`. So both exist for
# exactly one window: from this tag until every such revision is behind us.
# Both list the same bases -- one definition, two entry points, never a fork.
#
# Deleting this directory is the whole content of the v0.5.0 release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../infrastructure/net-cilium
  - ../../infrastructure/security-tetragon
